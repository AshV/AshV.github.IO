{{ define "main" }}
<main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center p-4 md:p-8 py-8 overflow-y-auto">

    <!-- Floating Particles (purely decorative) -->
    <div id="particle-field" class="fixed inset-0 pointer-events-none z-0" aria-hidden="true"></div>

    <!-- Central Glass Card -->
    <div id="central-card" class="glass-panel relative rounded-[2rem] md:rounded-[3rem] p-6 md:p-8 lg:p-10 max-w-xl w-full text-center z-10 overflow-hidden group transition-all duration-500">

        <!-- Spotlight shimmer on hover -->
        <div class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-[var(--glass-highlight)] to-transparent group-hover:animate-[shimmer_2s_infinite] pointer-events-none"></div>

        <!-- Floating Astronaut -->
        <div id="astronaut" class="mx-auto mb-4 md:mb-6 w-28 h-28 md:w-36 md:h-36 relative" aria-hidden="true">
            <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-[0_0_40px_var(--blob-1)]">
                <!-- Tether line -->
                <path d="M100 180 Q 60 160, 40 190" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5">
                    <animate attributeName="d" values="M100 180 Q 60 160, 40 190;M100 180 Q 70 155, 35 185;M100 180 Q 60 160, 40 190" dur="4s" repeatCount="indefinite"/>
                </path>
                <!-- Body -->
                <ellipse cx="100" cy="110" rx="30" ry="38" fill="var(--glass-highlight)" stroke="var(--glass-border)" stroke-width="2"/>
                <!-- Helmet -->
                <circle cx="100" cy="72" r="28" fill="var(--glass-bg)" stroke="var(--glass-border)" stroke-width="2"/>
                <!-- Visor -->
                <ellipse cx="100" cy="72" rx="20" ry="18" fill="var(--bg-color-main)" opacity="0.8" stroke="var(--text-muted)" stroke-width="1"/>
                <!-- Visor glare -->
                <ellipse cx="92" cy="66" rx="6" ry="4" fill="var(--glass-highlight)" opacity="0.6" transform="rotate(-20 92 66)"/>
                <!-- Backpack -->
                <rect x="70" y="90" width="10" height="30" rx="4" fill="var(--glass-highlight)" stroke="var(--glass-border)" stroke-width="1" opacity="0.7"/>
                <!-- Left arm -->
                <path d="M70 105 Q 50 100, 45 115" stroke="var(--glass-highlight)" stroke-width="6" stroke-linecap="round" fill="none">
                    <animate attributeName="d" values="M70 105 Q 50 100, 45 115;M70 105 Q 48 95, 42 108;M70 105 Q 50 100, 45 115" dur="3s" repeatCount="indefinite"/>
                </path>
                <!-- Right arm (waving) -->
                <path d="M130 105 Q 150 95, 155 80" stroke="var(--glass-highlight)" stroke-width="6" stroke-linecap="round" fill="none">
                    <animate attributeName="d" values="M130 105 Q 150 95, 155 80;M130 105 Q 155 88, 160 72;M130 105 Q 150 95, 155 80" dur="2s" repeatCount="indefinite"/>
                </path>
                <!-- Left leg -->
                <path d="M88 146 Q 80 165, 75 175" stroke="var(--glass-highlight)" stroke-width="6" stroke-linecap="round" fill="none">
                    <animate attributeName="d" values="M88 146 Q 80 165, 75 175;M88 146 Q 82 168, 78 180;M88 146 Q 80 165, 75 175" dur="5s" repeatCount="indefinite"/>
                </path>
                <!-- Right leg -->
                <path d="M112 146 Q 120 165, 125 175" stroke="var(--glass-highlight)" stroke-width="6" stroke-linecap="round" fill="none">
                    <animate attributeName="d" values="M112 146 Q 120 165, 125 175;M112 146 Q 118 162, 122 170;M112 146 Q 120 165, 125 175" dur="4.5s" repeatCount="indefinite"/>
                </path>
                <!-- Stars around astronaut -->
                <circle cx="30" cy="40" r="2" fill="var(--text-main)" opacity="0.6">
                    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.5s" repeatCount="indefinite"/>
                </circle>
                <circle cx="170" cy="50" r="1.5" fill="var(--text-main)" opacity="0.4">
                    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
                </circle>
                <circle cx="155" cy="150" r="2" fill="var(--text-main)" opacity="0.5">
                    <animate attributeName="opacity" values="0.5;0.05;0.5" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="45" cy="155" r="1" fill="var(--text-main)" opacity="0.3">
                    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
                </circle>
                <circle cx="160" cy="30" r="1" fill="var(--text-main)" opacity="0.4">
                    <animate attributeName="opacity" values="0.4;0;0.4" dur="1.8s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>

        <!-- Glitch 404 Text -->
        <div class="relative mb-2 md:mb-4 select-none" aria-hidden="true">
            <h1 id="glitch-text" class="text-7xl md:text-8xl font-bold tracking-tighter leading-none bg-clip-text text-transparent bg-gradient-to-r from-[var(--blob-1)] via-[var(--blob-2)] to-[var(--blob-3)]"
                data-text="404">
                404
            </h1>
        </div>

        <!-- Did you mean? Suggestions — IN FOCUS AREA, right after 404 heading -->
        <div id="suggestions-section" class="w-full mx-auto mb-4 hidden">
            <div class="flex items-center justify-center gap-2 mb-3 md:mb-4">
                <span class="inline-block w-2 h-2 rounded-full bg-[var(--blob-1)] animate-pulse"></span>
                <p class="text-xs md:text-sm font-medium text-[var(--text-muted)]">
                    Were you looking for one of these?
                </p>
            </div>
            <div id="suggestions-list" class="grid gap-4 w-full"></div>
            <div class="mt-5 md:mt-6">
                <a href="/" id="btn-home-alt"
                   class="group/btn inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-full border border-[var(--glass-border)] text-[var(--text-muted)] text-xs font-medium transition-all duration-300 hover:border-[var(--blob-1)] hover:text-[var(--text-main)] hover:scale-105 active:scale-95 bg-[var(--glass-bg)] backdrop-blur-md">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                    </svg>
                    Or return to home
                </a>
            </div>
        </div>

        <!-- Default 404 content (hidden when suggestions are shown) -->
        <div id="default-404-content">
            <!-- Message -->
            <h2 class="text-lg md:text-2xl font-semibold text-[var(--text-main)] mb-2 md:mb-3 tracking-tight">
                Lost in space
            </h2>
            <p class="text-xs md:text-sm text-[var(--text-muted)] max-w-sm mx-auto mb-5 md:mb-7 leading-relaxed">
                The page you're looking for has drifted beyond the known universe.
                Let's navigate you back to familiar territory.
            </p>

            <!-- CTA Button -->
            <a href="/" id="btn-home"
               class="group/btn inline-flex items-center gap-2.5 px-6 py-3 md:px-8 md:py-3.5 rounded-full bg-gradient-to-r from-[var(--blob-1)] to-[var(--blob-2)] text-[var(--bg-color-main)] font-semibold text-sm transition-all duration-300 hover:scale-105 hover:shadow-[0_0_40px_var(--blob-1)] active:scale-95 relative overflow-hidden">
                <!-- Button shimmer -->
                <span class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/25 to-transparent group-hover/btn:animate-[shimmer_1.5s_infinite] pointer-events-none"></span>
                <svg class="w-4 h-4 transition-transform group-hover/btn:-translate-x-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                    <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                <span class="relative">Beam me home</span>
            </a>
        </div>

        <!-- Attempted URL hint -->
        <p id="attempted-path" class="mt-4 md:mt-5 text-[10px] md:text-xs text-[var(--text-muted)] opacity-50 font-mono truncate max-w-full px-4"></p>
    </div>

</main>

<style>
    /* Viewport / scroll lock on 404 */
    body:has(#astronaut) {
        min-height: 100vh;
    }
    body:has(#astronaut):not(.has-suggestions) {
        overflow: hidden;
        height: 100vh;
        max-height: 100vh;
    }
    body.has-suggestions {
        overflow-y: auto;
        min-height: 100vh;
    }

    /* Astronaut floating animation */
    #astronaut {
        animation: astronaut-drift 6s ease-in-out infinite;
    }
    @keyframes astronaut-drift {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50%      { transform: translateY(-12px) rotate(3deg); }
    }

    /* Glitch effect on the 404 text */
    #glitch-text {
        position: relative;
    }
    #glitch-text::before,
    #glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        background: inherit;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0;
    }
    #glitch-text::before {
        animation: glitch-1 4s infinite linear;
        clip-path: inset(0 0 65% 0);
    }
    #glitch-text::after {
        animation: glitch-2 4s infinite linear;
        clip-path: inset(65% 0 0 0);
    }

    @keyframes glitch-1 {
        0%, 88%, 100% { opacity: 0; transform: none; }
        89%           { opacity: 0.8; transform: translate(-4px, -2px); }
        90%           { opacity: 0.8; transform: translate(4px, 2px); }
        91%           { opacity: 0; transform: none; }
    }
    @keyframes glitch-2 {
        0%, 92%, 100% { opacity: 0; transform: none; }
        93%           { opacity: 0.8; transform: translate(4px, -2px); }
        94%           { opacity: 0.8; transform: translate(-4px, 2px); }
        95%           { opacity: 0; transform: none; }
    }

    /* Particle styles */
    .drift-particle {
        position: absolute;
        border-radius: 50%;
        background: var(--text-main);
        pointer-events: none;
        will-change: transform, opacity;
        animation: particle-float linear infinite;
    }

    @keyframes particle-float {
        0%   { transform: translateY(0) translateX(0); opacity: 0; }
        10%  { opacity: var(--p-opacity, 0.3); }
        90%  { opacity: var(--p-opacity, 0.3); }
        100% { transform: translateY(-100vh) translateX(var(--p-drift, 20px)); opacity: 0; }
    }

    /* Shimmer keyframes */
    @keyframes shimmer {
        100% { transform: translateX(200%); }
    }

    /* Suggestion section */
    @keyframes suggestion-card-enter {
        from {
            opacity: 0;
            transform: translateY(16px) scale(0.97);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .suggestion-card-home {
        animation: suggestion-card-enter 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
</style>

<script>
(function() {
    /* ==============================================
       BROKEN PATH RESOLVER
       Three-tier redirect: exact → prefix → suggest
       ============================================== */

    // Hugo injects the redirect data at build time
    const DATA = {{ $.Site.Data.redirects | jsonify | safeJS }};

    // Normalize the current path: lowercase, strip trailing slash (keep root /)
    const rawPath = window.location.pathname;
    const normPath = rawPath.replace(/\/+$/, '').toLowerCase() || '/';

    // ---- Build inverted lookup maps from the destination-centric data ----
    const aliasMap = {};   // lowercase alias → { destination, title, image, keywords }
    const kwMap = {};      // keyword → [{ destination, title, image, keywords }, ...]

    (DATA.redirects || []).forEach(function(entry) {
        const dest = entry.destination;
        const title = entry.title || dest;
        const image = entry.image || '';
        const keywords = entry.keywords || [];

        // Invert aliases
        (entry.aliases || []).forEach(function(alias) {
            aliasMap[alias.toLowerCase().replace(/\/+$/, '')] = { destination: dest, title: title, image: image, keywords: keywords };
        });

        // Invert keywords
        keywords.forEach(function(kw) {
            var key = kw.toLowerCase();
            if (!kwMap[key]) kwMap[key] = [];
            // Avoid duplicates for the same destination
            if (!kwMap[key].some(function(e) { return e.destination === dest; })) {
                kwMap[key].push({ destination: dest, title: title, image: image, keywords: keywords });
            }
        });
    });

    // ---- Tier 1: Exact alias redirect ----
    var exactMatch = aliasMap[normPath];
    if (exactMatch) {
        // SEO: inject canonical link
        var canon = document.createElement('link');
        canon.rel = 'canonical';
        canon.href = exactMatch.destination;
        document.head.appendChild(canon);

        // SEO: inject meta refresh as crawler fallback
        var refresh = document.createElement('meta');
        refresh.httpEquiv = 'refresh';
        refresh.content = '0;url=' + exactMatch.destination;
        document.head.appendChild(refresh);

        // Redirect (replaces history entry — no back-button loop)
        window.location.replace(exactMatch.destination);
        return; // Stop execution, page will redirect
    }

    // ---- Tier 2: Prefix redirect ----
    var prefixes = DATA.prefixRedirects || {};
    var prefixKeys = Object.keys(prefixes);
    for (var i = 0; i < prefixKeys.length; i++) {
        if (normPath.indexOf(prefixKeys[i].toLowerCase()) === 0) {
            var prefDest = prefixes[prefixKeys[i]];
            var canon2 = document.createElement('link');
            canon2.rel = 'canonical';
            canon2.href = prefDest;
            document.head.appendChild(canon2);

            var refresh2 = document.createElement('meta');
            refresh2.httpEquiv = 'refresh';
            refresh2.content = '0;url=' + prefDest;
            document.head.appendChild(refresh2);

            window.location.replace(prefDest);
            return;
        }
    }

    // ---- If we reach here, show the 404 page ----

    // Show the attempted path
    var pathEl = document.getElementById('attempted-path');
    if (pathEl && rawPath !== '/') {
        pathEl.textContent = rawPath;
    }

    // ---- Tier 3: Keyword-based suggestions ----
    // Tokenize the path: split on /, -, _, ., and digits-to-letters boundaries
    var tokens = normPath
        .replace(/^\//,'')          // strip leading slash
        .split(/[\/\-_\.]+/)        // split on separators
        .filter(function(t) { return t.length > 1; }); // skip single chars

    // Score each destination by how many keyword tokens match
    var scores = {};  // destination → { score, title, destination, image, keywords }
    tokens.forEach(function(token) {
        if (kwMap[token]) {
            kwMap[token].forEach(function(entry) {
                if (!scores[entry.destination]) {
                    scores[entry.destination] = { score: 0, title: entry.title, destination: entry.destination, image: entry.image, keywords: entry.keywords };
                }
                scores[entry.destination].score++;
            });
        }
    });

    // Sort by score descending, take top 3
    var suggestions = Object.keys(scores)
        .map(function(k) { return scores[k]; })
        .sort(function(a, b) { return b.score - a.score; })
        .slice(0, 3);

    // Dynamic 3D tilt & spotlight effect for cards
    function attachCardTilt(card) {
        if (!window.matchMedia('(pointer: fine)').matches) return;
        card.addEventListener('mousemove', function(e) {
            var rect = card.getBoundingClientRect();
            var x = e.clientX - rect.left;
            var y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', x + 'px');
            card.style.setProperty('--mouse-y', y + 'px');

            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var rotateX = ((y - centerY) / centerY) * -8;
            var rotateY = ((x - centerX) / centerX) * 8;
            card.style.transform = 'perspective(1000px) translateY(-5px) scale3d(1.02, 1.02, 1.02) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
        });
        card.addEventListener('mouseleave', function() {
            card.style.transform = '';
            card.style.transition = 'transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
        });
        card.addEventListener('mouseenter', function() {
            card.style.transition = 'none';
        });
    }

    // Render suggestions if we have any
    if (suggestions.length > 0) {
        var section = document.getElementById('suggestions-section');
        var list = document.getElementById('suggestions-list');
        var defaultContent = document.getElementById('default-404-content');
        var astronaut = document.getElementById('astronaut');
        var centralCard = document.getElementById('central-card');

        if (section && list) {
            // Enable body scrolling if needed on mobile/smaller screens
            document.body.classList.add('has-suggestions');

            // Hide default 404 content & shrink astronaut to keep suggestions in focus
            if (defaultContent) defaultContent.style.display = 'none';
            if (astronaut) {
                astronaut.classList.remove('mb-4', 'md:mb-6', 'w-28', 'h-28', 'md:w-36', 'md:h-36');
                astronaut.classList.add('mb-2', 'md:mb-3', 'w-16', 'h-16', 'md:w-20', 'md:h-20');
            }

            // Adapt central card and grid layout based on number of suggestions
            if (centralCard) {
                centralCard.classList.remove('max-w-xl');
                if (suggestions.length === 1) {
                    centralCard.classList.add('max-w-lg');
                    list.className = 'grid grid-cols-1 max-w-sm mx-auto gap-4 w-full';
                } else if (suggestions.length === 2) {
                    centralCard.classList.add('max-w-2xl', 'md:max-w-3xl');
                    list.className = 'grid grid-cols-1 sm:grid-cols-2 max-w-2xl mx-auto gap-4 md:gap-6 w-full';
                } else {
                    centralCard.classList.add('max-w-4xl', 'lg:max-w-5xl');
                    list.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6 w-full';
                }
            }

            suggestions.forEach(function(s, idx) {
                var a = document.createElement('a');
                a.href = s.destination;
                a.className = 'glass-panel glass-spotlight tilt-card rounded-[1.75rem] md:rounded-[2rem] overflow-hidden group cursor-pointer flex flex-col h-full suggestion-card-home transition-all duration-300 hover:border-[var(--blob-1)]';
                a.style.display = 'flex';
                a.style.textDecoration = 'none';
                a.style.animationDelay = (idx * 0.1) + 's';

                // Tag badges in top-right corner of image
                var tags = (s.keywords && s.keywords.length > 0) ? s.keywords.slice(0, 2) : ['Tool'];
                var tagsHtml = tags.map(function(t) {
                    return '<span class="tag px-2.5 py-0.5 text-[10px] md:text-xs font-medium rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] backdrop-blur-md transition-opacity duration-300 group-hover:opacity-0 capitalize">' + t + '</span>';
                }).join('');

                // Image element with smooth hover scale
                var imgHtml = s.image
                    ? '<img src="' + s.image + '" alt="' + s.title + '" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110" loading="eager">'
                    : '<div class="w-full h-full bg-gradient-to-br from-[var(--blob-1)] to-[var(--blob-2)] flex items-center justify-center opacity-80"></div>';

                a.innerHTML =
                    '<div class="h-36 sm:h-40 md:h-44 overflow-hidden relative border-b border-[var(--glass-border)]">' +
                        '<div class="absolute inset-0 bg-black/20 z-10 group-hover:bg-transparent transition-colors duration-500"></div>' +
                        imgHtml +
                        '<div class="absolute top-3 right-3 z-30 flex gap-1.5">' +
                            tagsHtml +
                        '</div>' +
                    '</div>' +
                    '<div class="p-4 md:p-5 flex-1 flex flex-col justify-center tilt-content text-left">' +
                        '<h3 class="text-base md:text-lg font-semibold leading-snug text-[var(--text-main)] transition-all group-hover:text-shadow-sm group-hover:text-[var(--blob-1)]">' +
                            s.title +
                        '</h3>' +
                        '<p class="text-xs text-[var(--text-muted)] mt-1.5 font-mono opacity-75 truncate">' +
                            s.destination +
                        '</p>' +
                    '</div>';

                // Attach interactive 3D tilt and mouse spotlight tracking
                attachCardTilt(a);

                list.appendChild(a);
            });

            section.classList.remove('hidden');
        }
    }

    // ---- Floating particles (decorative) ----
    var field = document.getElementById('particle-field');
    if (field) {
        var count = window.innerWidth < 640 ? 20 : 40;
        for (var j = 0; j < count; j++) {
            var p = document.createElement('div');
            p.classList.add('drift-particle');
            var size = Math.random() * 3 + 1;
            var left = Math.random() * 100;
            var delay = Math.random() * 15;
            var duration = Math.random() * 12 + 10;
            var drift = (Math.random() - 0.5) * 80;
            var opacity = Math.random() * 0.3 + 0.05;
            p.style.cssText =
                'width:' + size + 'px;' +
                'height:' + size + 'px;' +
                'left:' + left + '%;' +
                'bottom:-' + size + 'px;' +
                'animation-delay:' + delay + 's;' +
                'animation-duration:' + duration + 's;' +
                '--p-drift:' + drift + 'px;' +
                '--p-opacity:' + opacity + ';';
            field.appendChild(p);
        }
    }

    // ---- Parallax tilt on astronaut following cursor ----
    var astro = document.getElementById('astronaut');
    if (astro && window.matchMedia('(pointer: fine)').matches) {
        document.addEventListener('mousemove', function(e) {
            var cx = window.innerWidth / 2;
            var cy = window.innerHeight / 2;
            var dx = (e.clientX - cx) / cx;
            var dy = (e.clientY - cy) / cy;
            astro.style.transform = 'translateY(' + (-12 * Math.sin(Date.now()/1000)) + 'px) rotate(' + (dx * 8) + 'deg) translateX(' + (dx * 12) + 'px)';
        });
    }
})();
</script>
{{ end }}

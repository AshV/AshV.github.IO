<header id="hero-section" class="sticky top-6 z-40 w-full mb-8 flex flex-col perspective-[1000px] transition-all">
    <div
        class="glass-panel glass-spotlight relative overflow-hidden group w-full flex items-center justify-between px-4 min-[400px]:px-6 py-3 md:px-8 md:py-4 rounded-[2rem] md:rounded-[3rem] mt-2 mb-4 transition-all">
        <div class="relative z-10 flex items-center gap-4 md:gap-6">
            <!-- Large Profile Image safely inside container -->
            <div
                class="w-20 h-20 min-[400px]:w-24 min-[400px]:h-24 md:w-[104px] md:h-[104px] rounded-full overflow-hidden border-[3px] border-white/20 shadow-lg shrink-0 group-hover:shadow-[0_10px_30px_rgba(31,38,135,0.4)] transition-shadow duration-500">
                <img src="/images/profile.jpg" alt="Profile"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            </div>

            <!-- Intro -->
            <div class="flex flex-col justify-center py-1">
                <h1
                    class="text-2xl md:text-3xl font-bold tracking-tight text-[var(--text-main)] leading-tight focus:outline-none">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Ashish<br
                            class="block md:hidden"><span class="hidden md:inline"> </span>Vishwakarma</span>
                </h1>
                <p
                    class="hidden md:block text-[var(--text-muted)] text-[10px] min-[400px]:text-xs md:text-sm font-medium leading-none mt-1.5 md:mt-2">
                    Engineer | AI Enthusiast | Open Source Contributor
                </p>
            </div>
        </div>

        <!-- Social Links - Hidden on Mobile -->
        <div class="hidden md:flex gap-2 lg:gap-3 relative z-10">
            <a href="https://www.linkedin.com/in/ashishvishwakarma-ashv"
                class="p-2 lg:p-2.5 xl:p-3 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition-colors backdrop-blur-md group"
                title="LinkedIn">
                <svg class="w-4 h-4 lg:w-5 lg:h-5 stroke-current text-[var(--text-main)] group-hover:scale-110 transition-transform" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
            </a>
            <a href="https://github.com/AshV"
                class="p-2 lg:p-2.5 xl:p-3 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition-colors backdrop-blur-md group"
                title="GitHub">
                <svg class="w-4 h-4 lg:w-5 lg:h-5 stroke-current text-[var(--text-main)] group-hover:scale-110 transition-transform" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
            </a>
            <a href="https://x.com/aryanroyal"
                class="p-2 lg:p-2.5 xl:p-3 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition-colors backdrop-blur-md group"
                title="X">
                <svg class="w-4 h-4 lg:w-5 lg:h-5 fill-current text-[var(--text-main)] group-hover:scale-110 transition-transform"
                    viewBox="0 0 24 24" aria-hidden="true">
                    <path
                        d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                </svg>
            </a>
            <a href="https://instagram.com/iAshishVi"
                class="p-2 lg:p-2.5 xl:p-3 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition-colors backdrop-blur-md group"
                title="Instagram">
                <svg class="w-4 h-4 lg:w-5 lg:h-5 stroke-current text-[var(--text-main)] group-hover:scale-110 transition-transform" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
            </a>
            <a href="#"
                class="p-2 lg:p-2.5 xl:p-3 rounded-full bg-[var(--glass-bg)] border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition-colors backdrop-blur-md group"
                title="Facebook">
                <svg class="w-4 h-4 lg:w-5 lg:h-5 stroke-current text-[var(--text-main)] group-hover:scale-110 transition-transform" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
            </a>
        </div>

        <!-- Shimmer effect -->
        <div
            class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-[var(--glass-highlight)] to-transparent group-hover:animate-[shimmer_2s_infinite] pointer-events-none">
        </div>
    </div>
</header>
